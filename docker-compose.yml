version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iqgs
    ports:
      - "5432:5432"
    volumes:
      - iqgs_pgdata:/var/lib/postgresql/data

  webapi:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=iqgs;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  iqgs_pgdata:
