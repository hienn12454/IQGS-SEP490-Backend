# CI/CD: build .NET 8 WebAPI và deploy lên Azure App Service khi code được merge/push lên nhánh main.
#
# Cấu hình GitHub (bắt buộc):
# 1. Repo → Settings → Secrets and variables → Actions → New repository secret
# 2. Tên: AZURE_WEBAPP_PUBLISH_PROFILE
# 3. Giá trị: toàn bộ nội dung file .PublishSettings tải từ Azure Portal
#    (Download publish profile) — dán nguyên XML, không chỉnh sửa.
#    Không commit publish profile hoặc mật khẩu vào git.
#
# Tên app trùng với resource trên Azure: IQGS-BE (xem WebAPI/Properties/PublishProfiles).

name: Deploy WebAPI to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: IQGS-BE
  DOTNET_VERSION: "8.0.x"
  PACKAGE_PATH: ${{ github.workspace }}/publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore IQGS-BE.sln

      - name: Build
        run: dotnet build IQGS-BE.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish WebAPI/WebAPI.csproj --configuration Release --no-build --output "${{ env.PACKAGE_PATH }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PACKAGE_PATH }}
